name: Build Windows app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows x64 app
        run: dotnet publish .\FreeFirePCBridge\FreeFirePCBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFirePCBridge-win-x64
          path: publish/**
          if-no-files-found: error
